name: Generate GitHub Stats SVG

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch:     # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Allows the action to save the image to your repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Stats SVG
        uses: cicirello/user-statistician@v1
        with:
          featured-repositories: false # Set to true if you want to highlight specific repos
          # Use 'tokyonight' or other themes
          theme: dark-blue 

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update GitHub Stats SVG" || exit 0
          git push
