name: Generate GitHub Stats SVG

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:     

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Stats SVG
        uses: cicirello/user-statistician@v1
        with:
          image-file: userstats.svg
          # We use the 'colors' input to mimic Tokyonight
          # Format: title;title-icons;text;icons;background;border
          colors: "#7aa2f7;#7dcfff;#acb0be;#7aa2f7;#1a1b26;#414868"
          include-title: true
          custom-title: "My GitHub Stats"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add userstats.svg
          git commit -m "Update GitHub Stats SVG" || exit 0
          git push
