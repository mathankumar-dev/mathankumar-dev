name: Generate Dual Stats SVGs

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:     

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Main Profile Card
      - name: Generate Main Stats
        uses: cicirello/user-statistician@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-file: userstats.svg
          custom-title: "Main Development Hub"
          # Tokyonight Hex Palette
          colors: "#7aa2f7;#7dcfff;#acb0be;#7aa2f7;#1a1b26;#24283b"
          hide-keys: "starred, forked, member-since"
          category-order: "general, contributions, languages"
          border-radius: 12

      # 2. Secondary Profile Card
      - name: Generate Secondary Stats
        uses: cicirello/user-statistician@v1
        env:
          GITHUB_TOKEN: ${{ secrets.SECONDARY_ACCOUNT_TOKEN }}
        with:
          image-file: otherstats.svg
          custom-title: "Alt Workspace"
          colors: "#7aa2f7;#7dcfff;#acb0be;#7aa2f7;#1a1b26;#24283b"
          hide-keys: "starred, forked, member-since"
          category-order: "general, contributions, languages"
          border-radius: 12

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add userstats.svg otherstats.svg
          git commit -m "🎨 Update dual profile stats with Tokyonight UI" || exit 0
          git push
